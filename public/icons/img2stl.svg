<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ModelMint 3D">
  <!-- Unlike the header logo, a favicon needs its own ground: it sits on
       browser chrome whose colour we do not control. -->
  <rect width="512" height="512" rx="96" fill="#0B1622"/>
  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">
<defs>
    <linearGradient id="mm-edge" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2ED8DE"/>
      <stop offset="1" stop-color="#0086A0"/>
    </linearGradient>
  </defs>

  <!-- Top face -->
  <path d="M256 84 452 190 256 296 60 190z"
        fill="#123243" stroke="url(#mm-edge)" stroke-width="34" stroke-linejoin="round"/>
  <!-- Left body -->
  <path d="M60 190v132l196 106V296z"
        fill="#0A1E29" stroke="url(#mm-edge)" stroke-width="34" stroke-linejoin="round"/>
  <!-- Right body -->
  <path d="M452 190v132L256 428V296z"
        fill="#0F2A38" stroke="url(#mm-edge)" stroke-width="34" stroke-linejoin="round"/>

  <!-- One slice layer: the print, in the accent colour. -->
  <path d="M96 250l160 86 160-86"
        fill="none" stroke="#F5A93C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
